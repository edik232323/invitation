<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:Cormorant,Georgia,serif;font-variant-numeric:lining-nums;
  background:radial-gradient(80% 90% at 30% 50%,#6E1730 0%,#4A0F1F 55%,#2C0711 100%);
  display:flex;align-items:center;gap:70px;padding:0 90px;color:#F6ECE2}
svg{width:420px;height:420px;flex:none}
.horn{fill:none;stroke:#C9A35E;stroke-width:1.4;stroke-linecap:round}
.num{font-style:italic;font-weight:300;font-size:140px;fill:#E4CC92}
p.k{font-size:36px;color:#E4CC92}
h1{font-weight:400;font-style:italic;font-size:92px;line-height:1;margin:14px 0 30px}
p.d{font-size:38px;font-weight:500}
p.d+p.d{opacity:.85;font-size:34px}
</style></head><body>
<svg viewBox="-160 -160 320 320">
  <circle r="104" class="horn" stroke-width="1.1"/>
  <circle r="150" class="horn" stroke-width=".6"/>
  <g class="horn" id="r"></g>
  <text class="num" y="46" text-anchor="middle">50</text>
</svg>
<div>
  <p class="k">мааракеге чакыруу / приглашение на юбилей</p>
  <h1>Надира<br>Мырзагулова</h1>
  <p class="d">28 ноября 2026, 17:00</p>
  <p class="d">Ресторан «Классик», Ош</p>
</div>
<script>
const H='<path d="M0 0 V-11 M0 -11 C0 -21 -10 -27 -17 -22 C-23 -17 -19 -9 -13 -11 C-9 -12 -10 -17 -13 -17"/><path d="M0 -11 C0 -21 10 -27 17 -22 C23 -17 19 -9 13 -11 C9 -12 10 -17 13 -17"/>';
let h='';for(let i=0;i<12;i++)h+=`<g transform="rotate(${30*i}) translate(0 -108) scale(1.15)">${H}</g>`;
document.getElementById('r').innerHTML=h;
</script>
</body></html>
